settings.cpu_budget_hover: >-
  Total CPU worker threads this instance may use, split between background
  image decoding and the parallel render / export / statistics passes. Lower it
  to leave CPU for other users when several instances share one server / VNC
  host; raise it temporarily for a heavy export, then put it back. Each pane
  keeps its own render thread on top of this. Applies immediately.
