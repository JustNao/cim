# ---- command line ----------------------------------------------------------
cli.unknown_shell: "cim: unknown shell '%{shell}' (try: bash, powershell)"
cli.help: |
  cim %{ver} — Compare Images & Sequences

  Lossless side-by-side viewer for images and sequences.

  USAGE:
      cim [OPTIONS] [FILES|SEQUENCES]...

  ARGS:
      <FILES|SEQUENCES|DIRS>...
          Any number of images, sequences, videos or directories to open
          (%{exts}).
          A numbered run may be given compactly as PREFIX%0Xu SUFFIX,START,END,
          e.g. frame_%05u.tif,0,12 expands to frame_00000.tif .. frame_00012.tif.
          A directory (e.g. `cim folder`) opens every loadable image inside it,
          sorted alphabetically, concatenated into one pane. Videos (%{vexts};
          decoded via the ffmpeg CLI, which must be on the PATH) always open as
          one pane each — including those found in a directory.
          A compute:<kind>:<srcs> token (kind = mean|std|add|sub; srcs = one
          pane index, or A,B for add/sub) recreates a Compute pane; it is
          normally generated for you by the "View cmd" panel, not typed by hand.

  OPTIONS:
      -h, --help                 Print this help and exit
      -V, --version              Print version and exit
          --complete <WORD>      List loadable completions for WORD, one per line
                                 (used by the shell completers below; consecutive
                                 numbered files collapse into the compact
                                 PREFIX%0Xu SUFFIX,START,END form)
          --completions <SHELL>  Print a completion script for SHELL to stdout
                                 (bash | powershell)

  VIEW STATE:
      These reproduce a saved viewpoint and are normally generated for you by the
      in-app "View cmd" panel (⧉ Copy). All indices are 0-based.

          --mode <grid|single|ab>  Initial layout
          --cols <N>               Grid columns
          --zoom <F>               Shared zoom (screen px per image px)
          --center <X,Y>           Shared view centre, in image pixels
          --frame <N>              Timeline frame to show
          --pane <N>               Focused pane
          --ab <A,B,SPLIT>         A/B operands and 0..1 divider position
          --tone <T,T,...>         Per-pane tone: linear | lutalpha | boost | raw |
                                 colormap[:viridis|turbo|diverging]
          --clip <C,C,...>         Per-pane Linear clip: off | PERCENT (each tail)
          --share-clip <B,B,...>   Per-pane share Control media's bounds (1/0)
          --global-stats <B,B,...> Per-pane min/max over all frames in memory (1/0)
          --curve <K,K,...>        Per-pane tone curve: auto | VALUE:LEVEL/VALUE:LEVEL/...
          --detail <B,B,...>       Per-pane details-operator toggles (1/0)
          --show <B,B,...>         Per-pane visibility / show-hide (1/0)
          --scale <B,B,...>        Per-pane scale to the Control media's size (1/0)
          --tsync <B,B,...>        Per-pane Visualization-sync toggles (1/0)
          --gsync <B,B,...>        Per-pane Geometry-sync toggles (rotation) (1/0)
          --rotate <D,D,...>       Per-pane display rotation in degrees (-180..180)
          --dai-rotate <B,B,...>   Per-pane add the DAI camera rotation (1/0, default 1)
          --dai <[N=]PATH>         Read pane N's DAI from PATH (csv / yaml / dai /
                                 dai2) instead of looking for it (repeatable);
                                 without N=, every media's
          --control <N>            Control media: shared clip source (+ timeline if a sequence)
          --loop <LO,HI>           Inclusive playback loop range (0-based)
          --name <N=TEXT>          Name pane N (0-based) TEXT; repeat per renamed pane
          --stats-region <X,Y,W,H> Statistics region, in image pixels
          --region-tone <1|0>      Tone computed over the statistics region

  EXPORT:
      Normally generated for you by the Export panel's "Command" button, which
      writes every setting. --export makes cim write the file and exit without
      opening a window; the other flags only pre-fill the Export panel.

          --export <FILE>          Export to FILE (.mp4, .tif, .png, .jpg) and exit
          --open                   With --export: open cim instead, the Export
                                 panel showing these settings, to adjust them
                                 before exporting
          --export-layout <grid|single|ab>
                                   Exported layout
          --export-region <X,Y,W,H|full>
                                   Export crop, in image pixels
          --export-lut <global|local>
                                   Tone of a cropped export: whole image or crop
          --export-frames <FROM,TO|all>
                                   Inclusive frame range (0-based)
          --export-height <N>      Output height in pixels
          --fps <F>                Video frame rate
          --crf <N>                x264 quality, 0 (lossless) – 51
          --labels <1|0>           Burn the media names in
          --label-size <PX>        Label text size, in output pixels
          --label-color <RRGGBBAA> Label text colour (premultiplied)
          --label-bg <1|0>         Box behind the label text
          --label-bg-color <RRGGBBAA>
                                   Label box colour (premultiplied)
          --label-anchor <POS>     top-left | top | top-right | left | center |
                                 right | bottom-left | bottom | bottom-right
          --label-margin <PX>      Gap between a label and its cell edge
          --parents <N>            Parent folders shown in media names
          --canvas <W,H,PPP>       Image area the view was captured in (points,
                                 pixels per point) — what --zoom/--center are
                                 relative to

  SHELL COMPLETION:
      bash         eval "$(cim --completions bash)"
      PowerShell   cim --completions powershell | Out-String | Invoke-Expression
