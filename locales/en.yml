settings.backend_none: no GPU found
settings.backend_cpu_only: CPU only
settings.hardware_accel_restart: (restart to apply)
settings.hardware_accel_hover: >-
  Build the displayed image on the GPU instead of the CPU. A large frame then
  stays in video memory, so changing the contrast window re-tones it almost
  instantly instead of re-mapping and re-uploading the whole image; the pixels
  are identical either way. Off by default: the CPU path is used unless you ask
  for this, and it is also what a machine with no graphics card falls back to.
  Panes running the C++ operators always use the CPU. Takes effect after a
  restart.
settings.cursor_dot: Cursor dot on other panes
settings.cursor_dot_hover: >-
  Mark the hovered pixel on every other pane with a red dot, so the same
