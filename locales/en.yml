  The whole sequence couldn't be loaded into memory — the frame cache is too
  small to hold every frame at once.


  The length was fully discovered (headers only), so the export frame range is
  correct and the encoder still reads the remaining frames from disk as it
  runs. To keep more frames resident, raise the Frame cache budget in Settings.

