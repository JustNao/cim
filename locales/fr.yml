# ---- ligne de commande -----------------------------------------------------
cli.unknown_shell: "cim : shell « %{shell} » inconnu (essayez : bash, powershell)"
cli.help: |
  cim %{ver} — Comparer images et séquences

  Visionneuse sans perte, côte à côte, pour images et séquences.

  UTILISATION :
      cim [OPTIONS] [FICHIERS|SÉQUENCES]...

  ARGUMENTS :
      <FICHIERS|SÉQUENCES|DOSSIERS>...
          Autant d'images, de séquences, de vidéos ou de dossiers que voulu
          (%{exts}).
          Une suite numérotée peut s'écrire de façon compacte
          PRÉFIXE%0Xu SUFFIXE,DÉBUT,FIN — par ex. frame_%05u.tif,0,12 donne
          frame_00000.tif .. frame_00012.tif.
          Un dossier (par ex. `cim dossier`) ouvre toutes les images qu'il
          contient, triées alphabétiquement, concaténées en un seul panneau.
          Les vidéos (%{vexts} ; décodées par la CLI ffmpeg, qui doit être dans
          le PATH) ouvrent toujours un panneau chacune — y compris celles
          trouvées dans un dossier.
          Un jeton compute:<type>:<sources>[:auto] (type = mean|std|diff ;
          sources = un indice de panneau, ou A,B pour diff) recrée un panneau de
          calcul ; il est normalement généré par le panneau « Cmd vue », pas
          saisi à la main.

  OPTIONS :
      -h, --help                 Afficher cette aide et quitter
      -V, --version              Afficher la version et quitter
          --complete <MOT>       Lister les complétions pour MOT, une par ligne
                                 (utilisé par les compléteurs ci-dessous ; les
                                 fichiers numérotés consécutifs sont regroupés
                                 sous la forme PRÉFIXE%0Xu SUFFIXE,DÉBUT,FIN)
          --completions <SHELL>  Afficher un script de complétion pour SHELL
                                 (bash | powershell)

  ÉTAT DE LA VUE :
      Ces options reproduisent une vue enregistrée et sont normalement générées
      par le panneau « Cmd vue » de l'application (⧉ Copier). Tous les indices
      commencent à 0.

          --mode <grid|single|ab>  Disposition initiale
          --cols <N>               Colonnes de la grille
          --zoom <F>               Zoom partagé (px écran par px image)
          --center <X,Y>           Centre de la vue partagée, en pixels image
          --frame <N>              Image de la timeline à afficher
          --pane <N>               Panneau sélectionné
          --ab <A,B,SPLIT>         Opérandes A/B et position 0..1 du séparateur
          --tone <T,T,...>         Rendu par panneau : linear | lutalpha |
                                 colormap[:viridis|turbo|diverging]
          --clip <C,C,...>         Écrêtage linéaire par panneau : off | POURCENT
          --share-clip <B,B,...>   Bornes du média Contrôle par panneau (1/0)
          --detail <B,B,...>       Bascules DETAILS_ENHANCED par panneau (1/0)
          --show <B,B,...>         Visibilité par panneau (1/0)
          --tsync <B,B,...>        Sync Visualisation par panneau (1/0)
          --gsync <B,B,...>        Sync Géométrie (rotation) par panneau (1/0)
          --rotate <D,D,...>       Rotation d'affichage par panneau, en degrés
                                 (-180..180)
          --control <N>            Média Contrôle : source des bornes partagées
                                 (+ timeline si c'est une séquence)
          --loop <LO,HI>           Plage de boucle inclusive (à partir de 0)

  COMPLÉTION SHELL :
      bash         eval "$(cim --completions bash)"
      PowerShell   cim --completions powershell | Out-String | Invoke-Expression
