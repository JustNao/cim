  La longueur a bien été découverte en entier (en-têtes seuls) : la plage
  d'export est donc correcte, et l'encodeur lit les images restantes depuis le
  disque au fil de l'export. Pour garder plus d'images en mémoire, augmentez le
  cache d'images dans les Réglages.

